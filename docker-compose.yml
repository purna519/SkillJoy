version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: skilljoy-postgres
    restart: always
    environment:
      POSTGRES_USER: skilljoy
      POSTGRES_PASSWORD: skilljoy_pass
      POSTGRES_DB: skilljoy
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: skilljoy-redis
    restart: always
    ports:
      - '6379:6379'

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    container_name: skilljoy-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: skilljoy-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@skilljoy.com
      PGADMIN_DEFAULT_PASSWORD: skilljoy_admin_pass
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
  es_data:
